name: qorder_bff
description: >-
  Thin backend-for-frontend for qorder. Holds orders and the waiter acceptance
  flow, so the customer and waiter apps share state across devices. The Ebriza
  POS adapter slots in behind the same store later, without changing the apps.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.4.0

dependencies:
  shelf: ^1.4.0
  shelf_router: ^1.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
