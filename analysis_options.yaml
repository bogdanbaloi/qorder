# Strict static analysis for qorder. The project rule is: all code (incl. UX)
# must be SOLID, modular, testable — and bugs must be caught automatically.
# CI runs `flutter analyze --fatal-infos`, so everything below is build-breaking.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Real bug sources -> hard errors.
    unawaited_futures: error
    use_build_context_synchronously: error
    cancel_subscriptions: error
    close_sinks: error
    avoid_dynamic_calls: error

linter:
  rules:
    # Correctness / bug prevention
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously
    - unnecessary_await_in_return
    - avoid_slow_async_io
    - always_declare_return_types
    - avoid_type_to_string
    # Immutability / clarity (SOLID-friendly)
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - sort_child_properties_last
    # Naming: camelCase is enforced by the analyzer (types UpperCamelCase,
    # members/vars lowerCamelCase, files snake_case). Names must also be
    # descriptive and intention-revealing: write `remoteController`, never
    # `rc`, no cryptic abbreviations. That semantic part is a REVIEW rule the
    # analyzer cannot check; the lints below cover only the casing.
    - camel_case_types
    - camel_case_extensions
    - non_constant_identifier_names
    - constant_identifier_names
    - library_names
    - library_prefixes
    - file_names
    - avoid_types_as_parameter_names

# Dart Code Linter (open-source fork of Dart Code Metrics): design smells,
# run on demand with `dart run dart_code_linter:metrics analyze lib`.
dart_code_linter:
  anti-patterns:
    - long-method
    - long-parameter-list
  metrics:
    cyclomatic-complexity: 20
    maximum-nesting-level: 5
    number-of-parameters: 5
    source-lines-of-code: 60
  metrics-exclude:
    - test/**
  rules:
    # The clang-tidy "magic numbers" equivalent. Const contexts are ignored;
    # a few intrinsic values are allowed (0/1/2, 60 min/hour, 100 bani/leu).
    - no-magic-number:
        allowed: [-1, 0, 1, 2, 60, 100]
    - avoid-nested-conditional-expressions
    - no-boolean-literal-compare
    - no-equal-then-else
    - prefer-immediate-return
