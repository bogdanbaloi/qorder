# Strict static analysis for qorder. The project rule is: all code (incl. UX)
# must be SOLID, modular, testable — and bugs must be caught automatically.
# CI runs `flutter analyze --fatal-infos`, so everything below is build-breaking.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Real bug sources -> hard errors.
    unawaited_futures: error
    use_build_context_synchronously: error
    cancel_subscriptions: error
    close_sinks: error
    avoid_dynamic_calls: error

linter:
  rules:
    # Correctness / bug prevention
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously
    - unnecessary_await_in_return
    - avoid_slow_async_io
    - always_declare_return_types
    - avoid_type_to_string
    # Immutability / clarity (SOLID-friendly)
    - prefer_final_locals
    - prefer_final_in_for_each
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - sort_child_properties_last
