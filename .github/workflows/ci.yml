name: CI

on:
  push:
    branches: [main] # feature branches run once via pull_request, not twice
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Static analysis (lints are errors)
        run: flutter analyze --fatal-infos
      - name: Design metrics (complexity / size smells)
        run: dart run dart_code_linter:metrics analyze lib --fatal-style --fatal-warnings --fatal-performance
      - name: Unit + widget tests
        run: flutter test
      # Integration test needs a device/emulator; run in a separate device job later.
      # No CI `dart format` gate: the formatter output drifts between SDK patch
      # versions, so it failed CI with no real code problem. Formatting is
      # enforced locally (dart format + the pre-commit style hook).

  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    # A real Postgres, so the multi-tenant persistence tests run for real (they
    # skip without QORDER_DATABASE_URL). Production uses a managed Postgres via
    # the same env.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qorder
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qorder"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      QORDER_DATABASE_URL: postgres://postgres:postgres@localhost:5432/qorder
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Analyze (lints are errors)
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test
