name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Static analysis (lints are errors)
        run: flutter analyze --fatal-infos
      - name: Design metrics (complexity / size smells)
        run: dart run dart_code_linter:metrics analyze lib --fatal-style --fatal-warnings --fatal-performance
      - name: Unit + widget tests
        run: flutter test
      # Integration test needs a device/emulator; run in a separate device job later.

  bff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bff
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (lints are errors)
        run: dart analyze --fatal-infos
      - name: Test
        run: dart test
